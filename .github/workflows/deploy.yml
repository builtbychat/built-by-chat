name: Approved production release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Apply migrations
        working-directory: apps/web
        run: npx wrangler d1 migrations apply built-by-chat --remote --env production
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
      - name: Deploy
        working-directory: apps/web
        run: npx wrangler deploy --env production
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
      - name: Export post-show backup instructions
        run: echo "Run npm run backup after every public show; remote export requires operator approval."
