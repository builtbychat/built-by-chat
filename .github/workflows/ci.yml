name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run assets:validate
      - run: npm run cf:types
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run cf:dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview-${{ github.sha }}
          path: apps/web/dist/client
          retention-days: 14
