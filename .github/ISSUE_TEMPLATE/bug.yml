name: Bug report
description: Report a reproducible problem with the site or town.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes: { label: What happened?, description: Include the route and expected behavior. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: dropdown
    id: device
    attributes: { label: Device, options: [Desktop, Tablet, Mobile, Assistive technology] }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes: { label: Safety, options: [{ label: I removed account credentials, personal data, and stream keys., required: true }] }
