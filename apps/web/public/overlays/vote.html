<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{margin:0;background:transparent;color:#eef6ff;font:700 32px Manrope,Arial}main{position:absolute;left:60px;right:60px;bottom:50px;background:#0b1026ee;border:2px solid #5de4e7;border-radius:18px;padding:28px 34px;box-shadow:0 22px 80px #0008}small{color:#ff7b72;font:500 18px monospace;letter-spacing:.15em}h1{font-size:44px;margin:12px 0 20px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.option{padding:16px;background:#182244;border-radius:10px}.bar{height:8px;background:#2d3b67;margin-top:12px;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#5de4e7}</style><main><small id="status">WAITING FOR VOTE</small><h1 id="question">The town is deciding…</h1><div class="options" id="options"></div></main><script>const q=new URLSearchParams(location.search),show=q.get('showId')||'show-001',protocol=location.protocol==='https:'?'wss:':'ws:';let state={counts:{}};function draw(){if(!state.poll)return;question.textContent=state.poll.question;status.textContent=state.poll.status==='closed'?'RESULTS':'VOTING OPEN';const total=Object.values(state.counts).reduce((a,b)=>a+b,0)||1;options.innerHTML=state.poll.options.map(o=>`<div class="option">${o.label} · ${state.counts[o.id]||0}<div class="bar"><i style="width:${(state.counts[o.id]||0)/total*100}%"></i></div></div>`).join('')}function connect(){const ws=new WebSocket(`${protocol}//${location.host}/api/live/${show}/socket`);ws.onmessage=e=>{const m=JSON.parse(e.data);state=m.state||{...state,...m};draw()};ws.onclose=()=>setTimeout(connect,1500)}connect()</script></html>
