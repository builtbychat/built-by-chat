<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tiny Signal Club — identity motion lab</title>
  <link rel="stylesheet" href="identity-lab.css">
</head>
<body>
  <main class="stage" aria-label="Tiny Signal Club identity motion study">
    <div class="paper" aria-hidden="true"></div>
    <div class="registration" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <section class="study receiver" data-study="receiver">
      <p class="label">Study 01 / The Receiver</p>
      <svg class="receiver-mark" viewBox="0 0 520 520" role="img" aria-label="An animated geometric receiver mascot">
        <g class="receiver-body">
          <path class="cream body-shape" d="M128 118 Q122 86 155 82 L362 82 Q395 84 390 118 L420 346 Q425 384 386 390 L133 390 Q94 386 101 348 Z"/>
          <circle class="ink dial" cx="218" cy="221" r="72"/>
          <path class="cream dial-tick" d="M218 221 L257 176"/>
          <circle class="coral indicator" cx="338" cy="242" r="18"/>
          <path class="cream antenna" d="M167 88 L151 34 L194 14"/>
          <circle class="cyan antenna-tip" cx="197" cy="13" r="17"/>
          <path class="cream leg leg-left" d="M168 389 l-14 20 14 20-14 20 14 20-14 20"/>
          <path class="cream leg leg-right" d="M330 389 l-14 20 14 20-14 20 14 20-14 20"/>
          <path class="cream foot" d="M123 487 h76 l-12 20 h-52z"/>
          <path class="cream foot" d="M285 487 h76 l-12 20 h-52z"/>
        </g>
        <path class="coral cable" pathLength="1" d="M389 329 C489 337 476 428 410 419 C357 412 370 361 437 375 C495 388 485 481 431 488"/>
        <circle class="pulse" r="10"><animateMotion dur="2.8s" repeatCount="indefinite" path="M389 329 C489 337 476 428 410 419 C357 412 370 361 437 375 C495 388 485 481 431 488"/></circle>
      </svg>
      <div class="tokens" aria-hidden="true"><i class="dot"></i><i class="step"></i><i class="spark"></i><i class="check"></i></div>
    </section>

    <section class="study traveling-pulse" data-study="pulse">
      <p class="label">Study 02 / The Traveling Pulse</p>
      <svg class="pulse-system" viewBox="0 0 900 520" role="img" aria-label="An animated coral pulse travels through modular project shapes">
        <g class="module module-one"><rect x="80" y="150" width="190" height="220" rx="18"/><circle cx="175" cy="260" r="58"/></g>
        <g class="module module-two"><circle cx="450" cy="260" r="118"/><circle cx="450" cy="260" r="65"/></g>
        <g class="module module-three"><path d="M630 150 H820 V370 H630 L685 260 Z"/><rect x="705" y="215" width="72" height="90" rx="12"/></g>
        <path class="pulse-track shadow" d="M120 326 H206 V280 H292 V234 H378 V188 H464 V234 H550 V280 H636 V234 H722"/>
        <path class="pulse-track signal" pathLength="1" d="M120 326 H206 V280 H292 V234 H378 V188 H464 V234 H550 V280 H636 V234 H722"/>
        <rect class="socket" x="101" y="307" width="38" height="38"/>
        <circle class="travel-dot" r="24"><animateMotion dur="3.7s" repeatCount="indefinite" path="M120 326 H206 V280 H292 V234 H378 V188 H464 V234 H550 V280 H636 V234 H722"/></circle>
      </svg>
      <div class="motion-caption" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    </section>

    <section class="study patch-pal" data-study="patch">
      <p class="label">Study 03 / Patch Pal</p>
      <svg class="patch-mark" viewBox="0 0 520 520" role="img" aria-label="An abstract four-part club character assembles and moves">
        <g class="patch-parts">
          <path class="coral cap" d="M142 163 A100 100 0 0 1 242 63 V163Z"/>
          <rect class="ink core" x="142" y="150" width="238" height="218" rx="54"/>
          <rect class="cream slot" x="201" y="245" width="121" height="20" rx="10"/>
          <path class="cyan spring" d="M380 245 c30-50 60 50 90 0 s60 50 30 78"/>
          <circle class="cyan plug" cx="494" cy="338" r="32"/>
          <path class="cream wedge foot-a" d="M170 367 l-77 85 h118z"/>
          <path class="cream wedge foot-b" d="M326 367 l112 60-127 24z"/>
        </g>
      </svg>
      <div class="patch-trail" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </section>

    <section class="study patch-signal" data-study="clubmark">
      <p class="label">Study 04 / Patch Signal</p>
      <svg class="clubmark-system" viewBox="0 0 900 520" role="img" aria-label="A small signal travels through an abstract modular club mark and emerges transformed">
        <g class="project-tiles">
          <path class="tile-a" d="M90 104 h118 v118 h-118z"/>
          <circle class="tile-b" cx="150" cy="350" r="58"/>
          <path class="tile-c" d="M695 92 h124 l-62 108z"/>
        </g>
        <g class="clubmark-body">
          <path class="mark-cap" d="M285 168 A92 92 0 0 1 377 76 V168Z"/>
          <rect class="mark-core" x="285" y="150" width="300" height="250" rx="66"/>
          <path class="mark-slot" d="M362 265 H492"/>
          <path class="mark-cable" pathLength="1" d="M104 280 H226 V236 H328 H540 V310 H664 V252 H785"/>
          <rect class="mark-socket" x="79" y="255" width="50" height="50"/>
          <circle class="mark-pulse" r="25"><animateMotion dur="3.4s" repeatCount="indefinite" path="M104 280 H226 V236 H328 H540 V310 H664 V252 H785"/></circle>
          <path class="mark-plug" d="M785 232 h54 v40 h-54z M839 240 h28 v7 h-28z M839 257 h28 v7 h-28z"/>
        </g>
        <g class="changed-token">
          <path d="M785 335 l16 38 38 16-38 16-16 38-16-38-38-16 38-16z"/>
        </g>
      </svg>
      <div class="system-key" aria-hidden="true"><span>INPUT</span><i></i><span>PATCH</span><i></i><span>REMIX</span></div>
    </section>

    <div class="wordmark" aria-label="Tiny Signal Club">
      <span>Tiny Signal</span><b>Club</b>
      <small>Small signals become big, strange things.</small>
    </div>
    <div class="timeline" aria-hidden="true"><i></i></div>
  </main>
  <script src="identity-lab.js"></script>
</body>
</html>
