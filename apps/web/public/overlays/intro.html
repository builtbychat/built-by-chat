<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tiny Signal Club — animated intro</title>
  <link rel="stylesheet" href="motion.css">
  <link rel="stylesheet" href="open-channel.css">
</head>
<body class="intro">
  <div class="sky"></div><div class="stars"></div><div class="grid"></div><div class="town"></div><div class="vignette"></div><div class="light-sweep"></div>
  <div class="frame" aria-hidden="true"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
  <main class="content">
    <section class="brand-lockup" aria-label="Tiny Signal Club intro">
      <img class="logo wordmark-logo" src="/brand/logo-wordmark-dark.svg" alt="Tiny Signal Club">
      <p class="eyebrow" data-param="eyebrow">Signal check complete</p>
      <h1><span data-param="title">Tiny Internet</span> <span class="accent" data-param="accent">Town</span></h1>
      <p class="tagline">Small signals become <strong>big, strange things.</strong></p>
    </section>
  </main>
  <footer class="status-row"><span class="live-dot" data-param="status">Tiny Internet Town</span><span data-param="episode">Episode 01 · Founding Day</span></footer>
  <button class="audio-notice" type="button">Audio paused — click or press M</button>
  <audio id="music" src="audio/city-loop.mp3" preload="auto" loop></audio>
  <audio id="chime" src="audio/completion-chime.mp3" preload="auto"></audio>
  <script src="motion.js"></script>
</body>
</html>
