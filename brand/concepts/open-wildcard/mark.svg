<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Signal Club open wildcard concept mark</title>
  <desc id="desc">Five black pieces form an incomplete asterisk with a detached orange square at the open arm.</desc>
  <g fill="#171613">
    <rect x="101" y="16" width="38" height="82" rx="18"/>
    <g transform="rotate(300 120 120)"><rect x="101" y="16" width="38" height="82" rx="18"/></g>
    <g transform="rotate(120 120 120)"><rect x="101" y="16" width="38" height="82" rx="18"/></g>
    <g transform="rotate(180 120 120)"><rect x="101" y="16" width="38" height="82" rx="18"/></g>
    <g transform="rotate(240 120 120)"><rect x="101" y="16" width="38" height="82" rx="18"/></g>
  </g>
  <rect x="184" y="40" width="30" height="30" rx="3" fill="#ff5b3d" transform="rotate(12 199 55)"/>
</svg>
