<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Signal Club open wildcard concept lockup</title>
  <desc id="desc">The open wildcard mark beside a bold stacked Tiny Signal Club wordmark.</desc>
  <rect width="1000" height="300" fill="#3157ff"/>
  <g transform="translate(34 30) scale(.95)" fill="#f1eadb">
    <rect x="101" y="16" width="38" height="82" rx="18"/>
    <g transform="rotate(60 120 120)"><rect x="101" y="16" width="38" height="82" rx="18"/></g>
    <g transform="rotate(120 120 120)"><rect x="101" y="16" width="38" height="82" rx="18"/></g>
    <g transform="rotate(180 120 120)"><rect x="101" y="16" width="38" height="82" rx="18"/></g>
    <g transform="rotate(240 120 120)"><rect x="101" y="16" width="38" height="82" rx="18"/></g>
    <rect x="184" y="40" width="30" height="30" rx="3" fill="#ff5b3d" transform="rotate(12 199 55)"/>
  </g>
  <g fill="#f1eadb" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-weight="900">
    <text x="335" y="82" font-family="ui-monospace, monospace" font-size="26" letter-spacing="6" fill="#171613"><tspan fill="#ff5b3d">TINY</tspan></text>
    <text x="330" y="186" font-size="122" letter-spacing="-8">SIGNAL</text>
    <text x="330" y="278" font-size="122" letter-spacing="-8">CLUB<tspan fill="#c8ef52">.</tspan></text>
  </g>
</svg>
