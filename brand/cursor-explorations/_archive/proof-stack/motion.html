<!doctype html>
<html lang="en">
<head>

  <title>Cursor route B · Proof Stack</title>
  <link rel="stylesheet" href="motion.css">
</head>
<body>

        <rect class="s4" x="42" y="168" width="150" height="22" rx="3"/>
        <rect class="s3" x="42" y="140" width="128" height="22" rx="3"/>
        <rect class="s2" x="42" y="112" width="104" height="22" rx="3"/>
        <rect class="s1" x="42" y="84" width="86" height="22" rx="3"/>
      </g>
      <rect class="signal" x="118" y="48" width="52" height="18" rx="3" fill="#ff5b3d"/>

    <div class="copy">
      <span>MODULAR ROUTE</span>
      <strong>Proofs<br>stack.</strong>
      <p>Verified contributions pile up. The newest one is still floating in.</p>

  </main>
  <script src="motion.js"></script>

</html>
