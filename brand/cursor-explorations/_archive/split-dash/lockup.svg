<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Signal Club Split Dash lockup</title>
  <desc id="desc">Split dash mark beside stacked Tiny Signal Club wordmark.</desc>
  <rect width="1000" height="300" fill="#f1eadb"/>
  <g transform="translate(40 30) scale(.95)">
    <rect x="28" y="98" width="72" height="44" rx="4" fill="#171613"/>
    <rect x="140" y="98" width="72" height="44" rx="4" fill="#171613"/>
    <rect x="108" y="104" width="24" height="32" rx="2" fill="#ff5b3d" transform="rotate(-8 120 120)"/>
  </g>
  <g fill="#171613" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-weight="900">
    <text x="320" y="78" font-family="ui-monospace, monospace" font-size="26" letter-spacing="7"><tspan fill="#ff5b3d">TINY</tspan></text>
    <text x="312" y="178" font-size="118" letter-spacing="-7">SIGNAL</text>
    <text x="312" y="268" font-size="118" letter-spacing="-7">CLUB<tspan fill="#3157ff">.</tspan></text>
  </g>
</svg>
