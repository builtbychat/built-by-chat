<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">interrupted-asterisk lockup</title>
  <desc id="desc">Geometry study mark with Tiny Signal Club wordmark.</desc>
  <rect width="1000" height="300" fill="#f1eadb"/>
  <g transform="translate(40 30) scale(.9)">
  <title id="title">Interrupted asterisk geometry study</title>
  <desc id="desc">Typographic six-stroke asterisk with one arm visibly broken and a detached contribution in the gap.</desc>
  <g fill="none" stroke="#171613" stroke-width="22" stroke-linecap="square">
    <path d="M120 28v70"/>
    <path d="M120 142v70"/>
    <path d="M28 120h70"/>
    <path d="M142 120h70"/>
    <path d="M48 48l49 49"/>
    <!-- intentional break on NE diagonal: only outer half drawn -->
    <path d="M168 48l-18 18"/>
  </g>
  <rect x="176" y="36" width="26" height="26" rx="2" fill="#ff5b3d" transform="rotate(14 189 49)"/>
</g>
  <g fill="#171613" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-weight="900">
    <text x="320" y="78" font-family="ui-monospace, monospace" font-size="26" letter-spacing="7"><tspan fill="#ff5b3d">TINY</tspan></text>
    <text x="312" y="178" font-size="118" letter-spacing="-7">SIGNAL</text>
    <text x="312" y="268" font-size="118" letter-spacing="-7">CLUB<tspan fill="#c8ef52">.</tspan></text>
  </g>
</svg>
