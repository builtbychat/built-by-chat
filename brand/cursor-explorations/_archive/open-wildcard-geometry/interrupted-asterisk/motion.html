<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interrupted asterisk motion</title>
  <link rel="stylesheet" href="motion.css">
</head>
<body>
  <main class="board" data-motion-root>
    <p class="label">Wildcard geometry 1 · Interrupted asterisk</p>
    <svg class="mark" viewBox="0 0 240 240" role="img" aria-label="Asterisk with a broken arm and incoming square">
      <g fill="none" stroke="#171613" stroke-width="22" stroke-linecap="square">
        <path d="M120 28v70"/><path d="M120 142v70"/><path d="M28 120h70"/><path d="M142 120h70"/><path d="M48 48l49 49"/><path class="stub" d="M168 48l-18 18"/>
      </g>
      <rect class="signal" x="176" y="36" width="26" height="26" rx="2" fill="#ff5b3d"/>
    </svg>
    <div class="copy"><span>OWNABLE WITHOUT COLOR</span><strong>Broken stroke,<br>not a burst.</strong><p>The missing length is the story. A full radial sparkle cannot claim this gap.</p></div>
  </main>
  <script src="motion.js"></script>
</body>
</html>
