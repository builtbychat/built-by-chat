<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">modular-void lockup</title>
  <desc id="desc">Geometry study mark with Tiny Signal Club wordmark.</desc>
  <rect width="1000" height="300" fill="#f1eadb"/>
  <g transform="translate(40 30) scale(.9)">
  <title id="title">Modular void geometry study</title>
  <desc id="desc">Five non-radial pieces around an irregular central void with one detached contribution.</desc>
  <g fill="#171613">
    <rect x="98" y="22" width="44" height="58" rx="4"/>
    <path d="M168 58h46v54h-34l-12-20z"/>
    <rect x="154" y="132" width="58" height="40" rx="4" transform="rotate(18 183 152)"/>
    <path d="M78 148h58v54H54l24-54z"/>
    <rect x="34" y="72" width="50" height="46" rx="4" transform="rotate(-12 59 95)"/>
  </g>
  <rect x="188" y="28" width="28" height="28" rx="2" fill="#ff5b3d" transform="rotate(9 202 42)"/>
  <!-- central void is the unfilled irregular gap between pieces -->
</g>
  <g fill="#171613" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-weight="900">
    <text x="320" y="78" font-family="ui-monospace, monospace" font-size="26" letter-spacing="7"><tspan fill="#ff5b3d">TINY</tspan></text>
    <text x="312" y="178" font-size="118" letter-spacing="-7">SIGNAL</text>
    <text x="312" y="268" font-size="118" letter-spacing="-7">CLUB<tspan fill="#c8ef52">.</tspan></text>
  </g>
</svg>
