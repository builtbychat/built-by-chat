<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Footnote bracket motion</title>
  <link rel="stylesheet" href="motion.css">
</head>
<body>
  <main class="board" data-motion-root>
    <p class="label">Wildcard geometry 3 · Footnote bracket</p>
    <svg class="mark" viewBox="0 0 240 240" role="img" aria-label="Bracket structure changed by a tiny input">
      <g fill="#171613">
        <path d="M40 36h36v168H40z"/>
        <path d="M40 36h108v28H40z"/>
        <path d="M40 176h108v28H40z"/>
        <path class="step" d="M148 96h28v48h-28z"/>
      </g>
      <rect class="signal" x="168" y="108" width="30" height="30" rx="2" fill="#ff5b3d"/>
    </svg>
    <div class="copy"><span>OWNABLE WITHOUT COLOR</span><strong>Tiny input,<br>visible change.</strong><p>The step only exists because the annotation arrived. Form equals story.</p></div>
  </main>
  <script src="motion.js"></script>
</body>
</html>
