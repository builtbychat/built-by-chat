<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc">
  <title id="title">Club Bench lockup</title>
  <desc id="desc">Stepped bench mark with Signal Club wordmark.</desc>
  <rect width="1080" height="340" fill="#f1eadb"/>
  <g transform="translate(28 28)">
    <path fill="#171613" d="M36 56H128V100H220V208H36Z"/>
    <rect x="140" y="62" width="48" height="28" rx="14" fill="#ff5b3d" transform="rotate(-6 164 76)"/>
    <rect x="178" y="68" width="40" height="24" rx="12" fill="none" stroke="#f1eadb" stroke-width="3" opacity=".55"/>
    <rect x="204" y="72" width="32" height="20" rx="10" fill="none" stroke="#f1eadb" stroke-width="2.5" opacity=".35"/>
  </g>
  <g fill="#171613" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-weight="900">
    <text x="310" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="14" fill="#ff5b3d">CLUB AS A BENCH</text>
    <text x="300" y="188" font-size="132" letter-spacing="-9">SIGNAL</text>
    <text x="300" y="298" font-size="132" letter-spacing="-9">CLUB<tspan fill="#c8ef52">.</tspan></text>
  </g>
</svg>
