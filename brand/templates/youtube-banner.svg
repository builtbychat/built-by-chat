<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Signal Club YouTube banner</title>
  <desc id="desc">Minimal wordmark, tagline, and weekly schedule within the YouTube safe area.</desc>
  <defs>
  <style>
    @font-face { font-family: Bricolage; src: url('../fonts/bricolage-grotesque/BricolageGrotesque-Variable.ttf'); font-weight: 200 800; }
    .display { font-family: Bricolage, Arial Black, sans-serif; font-weight: 800; font-variation-settings: 'opsz' 96, 'wdth' 84, 'wght' 800; }
    .meta { font-family: ui-monospace, Menlo, monospace; font-weight: 800; letter-spacing: .14em; }
  </style>
  
</defs>
  <rect width="2560" height="1440" fill="#3157ff"/>
  <rect y="1360" width="2560" height="80" fill="#ff5b3d"/>
  <image href="../svg/logo-wordmark-dark.svg" x="535" y="560" width="820" height="228"/>
  <rect x="1430" y="575" width="14" height="220" fill="#ff5b3d"/>
  <text x="1500" y="622" fill="#171613" class="meta" font-size="23">THE INTERNET DECIDES.</text>
  <text x="1500" y="700" fill="#f1eadb" class="display" font-size="62">WE BUILD IT LIVE.</text>
  <text x="1500" y="782" fill="#c8ef52" class="meta" font-size="22">THURSDAYS · 7 PM CT</text>
  <text x="64" y="98" fill="#f1eadb" opacity=".56" class="meta" font-size="18">SMALL SIGNALS → BIG, STRANGE THINGS</text>
  <text x="2496" y="98" fill="#f1eadb" opacity=".56" text-anchor="end" class="meta" font-size="18">PHAENEX HOSTS</text>
</svg>
