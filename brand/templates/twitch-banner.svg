<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Signal Club Twitch banner</title>
  <desc id="desc">Dark Twitch header with the Tiny Signal Club wordmark and weekly schedule.</desc>
  <defs>
  <style>
    @font-face { font-family: Bricolage; src: url('../fonts/bricolage-grotesque/BricolageGrotesque-Variable.ttf'); font-weight: 200 800; }
    .display { font-family: Bricolage, Arial Black, sans-serif; font-weight: 800; font-variation-settings: 'opsz' 96, 'wdth' 84, 'wght' 800; }
    .meta { font-family: ui-monospace, Menlo, monospace; font-weight: 800; letter-spacing: .14em; }
  </style>
  
</defs>
  <rect width="1200" height="480" fill="#171613"/>
  <rect width="22" height="480" fill="#ff5b3d"/>
  <image href="../svg/logo-wordmark-dark.svg" x="70" y="118" width="610" height="170"/>
  <rect x="750" y="112" width="10" height="190" fill="#ff5b3d"/>
  <text x="805" y="164" fill="#ff5b3d" class="meta" font-size="16">LIVE BUILD CLUB</text>
  <text x="805" y="229" fill="#f1eadb" class="display" font-size="43">THURSDAYS</text>
  <text x="805" y="279" fill="#c8ef52" class="display" font-size="38">7 PM CT</text>
  <text x="70" y="392" fill="#f1eadb" opacity=".58" class="meta" font-size="14">THE INTERNET DECIDES · WE BUILD IT LIVE</text>
</svg>
