<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiny Signal Club · Tiny input / big result ident</title><link rel="stylesheet" href="ident.css"></head>

      <p>ONE VIEWER SIGNAL</p>

    <div class="build" data-animated aria-hidden="true">
      <span></span>

      <p>BUILT + TESTED</p>
      <strong>NIGHT MARKET</strong>
    </div>

      <img src="../svg/logo-wordmark-dark.svg" alt="Tiny Signal Club">

    </div>
    <p class="next" data-animated>OPEN FOR THE NEXT SIGNAL →</p>
